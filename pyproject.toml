[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-ssdlc"
version = "0.1.0"
description = "Governed software engineering with LangGraph and evidence-backed gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.11", "langgraph-checkpoint-sqlite==3.1.1", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2", "setuptools>=77"]

[project.scripts]
ssdlc = "ssdlc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
